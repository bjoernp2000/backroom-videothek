<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE BACKROOM</title>
<style>
:root{
  --bg:#0b0e14; --card:#131826; --card2:#1a2133; --line:#232c42;
  --fg:#e8ecf5; --mut:#8a94ad; --acc:#e8b13c; --acc2:#4f8cff; --ok:#38c172; --err:#ff5d5d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,button,input,select{font-family:"Trebuchet MS","Segoe UI",sans-serif}
body{letter-spacing:.01em}
@keyframes goldBreath{0%,100%{filter:drop-shadow(0 0 0 rgba(232,177,60,0))}50%{filter:drop-shadow(0 0 14px rgba(232,177,60,.22))}}

#appintro{position:fixed;inset:0;z-index:999999;background:#000;overflow:hidden;opacity:1;transition:opacity .8s ease}
#appintro.fade{opacity:0;pointer-events:none}
#introVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#introAudio{position:absolute;opacity:0;height:0;width:0}
#appoutro{position:fixed;inset:0;z-index:1000000;display:none;align-items:center;justify-content:center;background:#050505;color:var(--fg);text-align:center;overflow:hidden}
#appoutro.show{display:flex;animation:outroIn .7s ease both}
#appoutro::before{content:'';position:absolute;inset:-30%;background:radial-gradient(ellipse at 50% 35%,rgba(229,9,20,.24),transparent 35%),linear-gradient(180deg,rgba(255,255,255,.035),transparent 32%,#050505 80%);animation:outroGlow 3.2s ease both}
#appoutro::after{content:'';position:absolute;left:0;right:0;bottom:15%;height:1px;background:linear-gradient(90deg,transparent,rgba(229,9,20,.8),transparent);box-shadow:0 0 22px rgba(229,9,20,.55);animation:outroLine 2.8s ease both}
#appoutro .outro-card{position:relative;z-index:1;width:min(720px,86vw);padding:34px 28px 30px;background:linear-gradient(180deg,rgba(24,24,24,.94),rgba(8,8,8,.72));border:1px solid rgba(255,255,255,.12);border-radius:6px;box-shadow:0 28px 90px rgba(0,0,0,.8);animation:outroCard 1s cubic-bezier(.16,1,.3,1) both}
#appoutro .outro-kicker{font-size:11px;letter-spacing:.34em;color:#aaa;text-transform:uppercase;margin-bottom:16px}
#appoutro h1{font-family:Arial Black,system-ui,sans-serif;font-size:clamp(30px,7vw,82px);line-height:.95;letter-spacing:.08em;color:#fff;margin:0 0 16px;text-shadow:0 0 26px rgba(229,9,20,.35)}
#appoutro h1 b{color:#e50914;font-weight:900}
#appoutro .outro-rule{height:2px;width:min(300px,60%);margin:0 auto 17px;background:linear-gradient(90deg,transparent,#e50914,transparent)}
#appoutro p{color:#bbb;font-size:14px;letter-spacing:.08em;margin:0}
#appoutro .outro-sub{font-size:11px;color:#666;letter-spacing:.2em;text-transform:uppercase;margin-top:18px}
@keyframes outroIn{from{opacity:0}to{opacity:1}}
@keyframes outroGlow{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes outroCard{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes outroLine{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@media(prefers-reduced-motion:reduce){#appoutro.show,#appoutro::before,#appoutro::after,#appoutro .outro-card{animation:none!important}}
/* Spektakulaere Intro-Schrift ueber dem Video */
#introTxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;background:radial-gradient(120% 90% at 50% 30%,rgba(0,0,0,.15),rgba(0,0,0,.72) 80%);pointer-events:none;padding:12vh 8vw}
.it-kicker{font-size:clamp(11px,2.2vw,18px);font-weight:700;letter-spacing:.28em;color:#e8b13c;text-transform:uppercase;opacity:0;animation:itKick .9s ease .3s forwards;text-shadow:0 2px 18px rgba(0,0,0,.95)}
.it-title{font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:clamp(34px,8vw,130px);font-weight:900;line-height:.92;letter-spacing:.01em;margin:6vh 0 0 0;text-align:center;background:linear-gradient(180deg,#fff 0%,#f5e6c0 30%,#e8b13c 55%,#b8860b 80%,#5a3a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 32px rgba(0,0,0,.9) inset);opacity:0;transform:scale(.88);animation:itTitle 1.3s cubic-bezier(.16,1,.3,1) .5s forwards,goldBreath 4s ease-in-out 2s infinite;white-space:nowrap;word-break:normal}
.it-title::after{content:'';display:block;height:3px;width:0;margin:3vh auto 0;background:linear-gradient(90deg,transparent,#e8b13c,transparent);animation:itLine 1.2s ease 1.6s forwards;box-shadow:0 0 12px rgba(232,177,60,.4)}
.it-sub{font-size:clamp(12px,2.4vw,20px);font-weight:300;letter-spacing:.18em;color:#dfe6f5;margin-top:2vh;opacity:0;animation:itSub 1.1s ease 1.9s forwards;text-shadow:0 2px 16px rgba(0,0,0,.95);text-transform:uppercase}
@keyframes itKick{to{opacity:1;letter-spacing:8px}}
@keyframes itTitle{to{opacity:1;transform:scale(1)}}
@keyframes itLine{to{width:min(320px,60vw)}}
@keyframes itSub{to{opacity:1}}
@media (prefers-reduced-motion: reduce){#introTxt *{animation:none!important;opacity:1!important;transform:none!important}.it-title::after{width:min(320px,60vw)}}
/* Theater-Vorhang: oeffnet sich, wenn der Film startet (UI-Transition, kein Wasserzeichen) */
#curtain{position:fixed;inset:0;z-index:96;pointer-events:none;display:none}
#curtain.on{display:block}
#curtain .cp{position:absolute;top:0;bottom:0;width:50.5%;will-change:transform;transition:transform 1.7s cubic-bezier(.75,0,.25,1)}
#curtain .l{left:0;background:repeating-linear-gradient(90deg,#6f0c1a 0 30px,#87152a 30px 40px,#550a15 40px 58px,#7e1224 58px 92px),linear-gradient(180deg,#7a1122,#5c0d19)}
#curtain .r{right:0;background:repeating-linear-gradient(270deg,#6f0c1a 0 30px,#87152a 30px 40px,#550a15 40px 58px,#7e1224 58px 92px),linear-gradient(180deg,#7a1122,#5c0d19)}
#curtain .folds{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(0,0,0,.25));mix-blend-mode:overlay}
#curtain .gold{position:absolute;top:0;left:0;right:0;height:30px;background:linear-gradient(180deg,#c9a227,#8a6a1a);box-shadow:0 4px 12px rgba(0,0,0,.5)}
#curtain.part .l{transform:translateX(-101%)}
#curtain.part .r{transform:translateX(101%)}
@media (prefers-reduced-motion: reduce){#curtain .cp{transition-duration:.6s}}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,'Segoe UI',sans-serif;min-height:100vh}
/* Saisonaler App-Hintergrund: feste Schicht hinter dem Inhalt, dunkel ueberlagert
   damit alles lesbar bleibt. Bild wird per JS je nach Jahreszeit/Feiertag gesetzt. */
#seabg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none;transition:opacity .8s}
#seabg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,14,20,.86),rgba(11,14,20,.93) 45%,rgba(11,14,20,.97))}
#tickhead,#strip,#crumb,main{position:relative;z-index:1}
#tickhead{display:flex;align-items:center;gap:12px;padding:5px 16px;background:linear-gradient(90deg,rgba(232,177,60,.10),rgba(79,140,255,.06));border-bottom:1px solid var(--line);font-size:12.5px;color:var(--fg)}
#tickclock{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.4px;color:var(--acc)}
#tickweather{white-space:nowrap;color:var(--mut)}
.tickmar{flex:1;min-width:0;overflow:hidden;position:relative;height:20px}
.tickwrap{display:inline-block;white-space:nowrap;will-change:transform;animation:tick 60s linear infinite}
.tickwrap:hover{animation-play-state:paused}
@keyframes tick{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
#ticktxt{display:inline-block}
#ticktxt a{color:var(--acc);text-decoration:none;margin:0 22px}
#ticktxt a:hover{text-decoration:underline}
#ticktxt .sep{color:var(--mut);opacity:.5;margin:0 12px}
@media(max-width:720px){#tickweather{display:none}.tickwrap{animation-duration:45s}}
header{position:sticky;top:0;z-index:20;background:rgba(11,14,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:10px 120px 10px 16px;max-width:1400px;margin:0 auto}
.logo{font-size:19px;font-weight:800;letter-spacing:.5px}
.logo b{color:var(--acc)}
nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;min-width:0;max-width:100%;padding-bottom:2px}
nav button{display:inline-flex;align-items:center;gap:6px;flex:none}
nav::-webkit-scrollbar{display:none}
.navic{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px}
.navsep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none;align-self:center}
.navmore{position:relative;flex:none}
.navmore-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;color:var(--mut);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.navmore-btn:hover{color:var(--fg);background:var(--card2)}
.navdrop{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:60;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.navdrop.open{display:flex;flex-direction:column}
.navdrop button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--mut);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left}
.navdrop button:hover{color:var(--fg);background:var(--card2)}
.navdrop button.on{color:var(--fg);background:var(--card2)}
.navic svg{width:16px;height:16px;fill:currentColor}
.collband .cn .ic{display:inline-flex;align-items:center;margin-right:6px;vertical-align:middle}
.collband .cn .ic svg{width:15px;height:15px;fill:var(--acc)}

nav button{background:none;border:1px solid transparent;color:var(--mut);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:14px}
nav button.on{color:var(--fg);background:var(--card2);border-color:var(--line)}
main{max-width:1400px;margin:0 auto;padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fgenres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fgen{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card2);border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;text-align:left}
.fgen:hover{border-color:var(--acc2)}
.fgen.on{background:var(--acc);color:#111;border-color:var(--acc)}
.fgen .fc{color:var(--mut);font-size:11px}
.fgen.on .fc{color:#333}
.facc{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--card2);cursor:pointer;font-size:13px;font-weight:600}
.facc-h .chev{color:var(--mut)}
.facc-b{padding:8px 10px;max-height:220px;overflow:auto}
.fpers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
.fpersq{width:100%;margin-bottom:4px}
#libbar{position:sticky;top:calc(var(--hdr,56px) - 1px);z-index:15;background:var(--bg);padding:10px 0 8px;margin-bottom:4px}
input[type=search],select{background:var(--card);border:1px solid var(--line);color:var(--fg);padding:9px 12px;border-radius:10px;font-size:14px;outline:none}
input[type=search]{flex:1;min-width:180px}
input[type=search]:focus,select:focus{border-color:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.cattile{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--line);aspect-ratio:2/3;transition:transform .12s,border-color .12s}
.cattile:hover{transform:translateY(-2px);border-color:var(--acc2)}
.cattile img{width:100%;height:100%;object-fit:cover}
.cattile .catph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#39445f;font-size:42px;background:linear-gradient(160deg,#1c2438,#12172a)}
.cattile .catname{position:absolute;left:0;right:0;bottom:0;padding:7px 11px;font-weight:700;font-size:13.5px;background:rgba(8,10,16,.78);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartsrow{display:flex;gap:14px;overflow-x:auto;padding:8px 2px 12px}
.chtile{position:relative;width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:var(--card);transition:transform .12s,border-color .12s}
.chtile:hover{transform:translateY(-2px);border-color:var(--acc2)}
.chtile img{width:100%;height:100%;object-fit:cover}
.chtile .crank{position:absolute;top:4px;left:4px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--acc2);color:#221;font-weight:800;font-size:15px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.chtile .cssub{position:absolute;left:0;right:0;bottom:0;padding:6px 9px;font-size:12.5px;line-height:1.35;background:rgba(8,10,16,.88);color:var(--fg);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.qp{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;opacity:0;transition:opacity .18s,transform .15s,box-shadow .2s;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(145deg,#f5c95c,#e8b13c 55%,#d99a1f);color:#141414;box-shadow:0 4px 18px rgba(232,177,60,.45),inset 0 1px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center}
.card:hover .qp{opacity:1}
.qp:hover{transform:scale(1.08);box-shadow:0 6px 26px rgba(232,177,60,.65),inset 0 1px 0 rgba(255,255,255,.5)}
.qp svg{width:20px;height:20px;fill:currentColor}
.poster{aspect-ratio:2/3;width:100%;background:linear-gradient(160deg,#1c2438,#12172a);display:flex;align-items:center;justify-content:center;color:#39445f;font-size:34px;object-fit:contain}
.poster.fanart{background-size:cover;background-position:center}
.poster.ph{position:relative;background:linear-gradient(160deg,#2b3b5e 0%,#1a2440 45%,#0e1526 100%);color:#8a94ad;overflow:hidden;display:flex;align-items:stretch;justify-content:stretch}
.poster.ph::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 1px,transparent 1px 5px);mix-blend-mode:overlay;pointer-events:none}
.poster.ph::after{content:'';position:absolute;right:-20%;top:-30%;width:70%;height:120%;background:radial-gradient(70% 60% at 100% 0%,rgba(79,140,255,.28),transparent 70%);pointer-events:none}
.poster.ph .ph-grad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 10%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.55))}
.poster.ph .ph-frame{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;padding:14px 12px;text-align:center;width:100%;height:100%}
.poster.ph .ph-y{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc);opacity:1}
.poster.ph .ph-t{font-size:15px;font-weight:800;color:#fff;letter-spacing:.3px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;word-break:break-word;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.poster.ph .ph-line{width:56px;height:2px;border-radius:2px;margin-top:2px;background:linear-gradient(90deg,var(--acc),rgba(232,177,60,.15))}
.card .t{padding:8px 10px 2px;font-size:13.5px;font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;min-height:35px;overflow-wrap:normal;word-break:normal;text-overflow:ellipsis}
.card .s{padding:0 10px 9px;font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.badge.done{color:var(--ok);border-color:var(--ok)}
.t10n{position:absolute;top:4px;left:4px;z-index:3;min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:rgba(11,14,20,.82);border:1px solid var(--acc);color:var(--acc);font-weight:900;font-size:16px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.newb{position:absolute;bottom:6px;left:6px;z-index:3;background:var(--acc);color:#04121a;font-weight:900;font-size:10px;letter-spacing:1px;padding:2px 7px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.wcard{position:relative;width:270px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--card);border:1px solid var(--line);transition:transform .16s,box-shadow .2s,border-color .16s;flex:none;scroll-snap-align:start}
.wcard:hover{transform:scale(1.06);z-index:4;box-shadow:0 10px 26px rgba(0,0,0,.65);border-color:var(--acc)}
.wcard .wbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .3s}
.wcard .wbg.blur{filter:blur(12px) brightness(.5)}
.wcard .wposter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:88%;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:1}
.wcard:hover .wbg{transform:scale(1.08)}
.wcard .wov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:linear-gradient(180deg,rgba(8,10,16,.08) 0%,rgba(8,10,16,.96) 100%);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:2;backdrop-filter:blur(2px)}
.wcard:hover .wov{opacity:1;transform:translateY(0);pointer-events:auto}

.wov-play,.wov-info{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.wov-play{background:var(--acc);color:#04121a}
.wov-play:hover{transform:scale(1.1)}
.wov-info{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(4px)}
.wov-info:hover{transform:scale(1.1)}
.wov-play svg,.wov-info svg{width:16px;height:16px;fill:currentColor}
.wov-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-bottom:4px}
.wov-ov{font-size:11.5px;line-height:1.4;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wr{position:absolute;top:6px;right:72px;z-index:4;font-size:11px;font-weight:800;color:var(--acc);background:rgba(11,14,20,.88);padding:2px 7px;border-radius:99px;white-space:nowrap}
.wseen{position:absolute;bottom:6px;left:6px;z-index:2;font-size:9px;font-weight:900;letter-spacing:1px;color:#04121a;background:var(--acc);padding:2px 7px;border-radius:99px}
.wt{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 10px 8px;font-size:13px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.88));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.wt .wy{color:var(--acc);font-weight:700;font-size:11.5px}
@media(max-width:640px){.wcard{width:220px}}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}
.empty h2{color:var(--fg);margin-bottom:8px}
.btn{background:linear-gradient(145deg,#f5c95c,#e8b13c 55%,#d99a1f);color:#141414;border:none;padding:10px 18px;border-radius:11px;font-weight:700;cursor:pointer;font-size:14px;box-shadow:0 3px 12px rgba(232,177,60,.28),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .18s,filter .15s;display:inline-flex;align-items:center;gap:7px}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(232,177,60,.45),inset 0 1px 0 rgba(255,255,255,.4);filter:brightness(1.04)}
.btn:active{transform:translateY(0);box-shadow:0 2px 8px rgba(232,177,60,.3)}
.btn svg{width:15px;height:15px;fill:currentColor}
.btn.sec{background:linear-gradient(145deg,#232c42,#1a2133);color:var(--fg);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05)}
.btn.sec:hover{box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);border-color:#33405f}
.btn.mini{padding:6px 11px;font-size:12px;border-radius:9px;flex:none}

.fsk{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:800;letter-spacing:.5px;border:1px solid var(--line);background:var(--card2);color:var(--mut);margin-left:8px;vertical-align:middle;white-space:nowrap}

.toolbar .btn.on{background:var(--acc);color:#111;border-color:var(--acc)}

/* Theater: VLC-Bild liegt als natives Fenster exakt auf #vbox-Flaeche (Backend embed.py) */

#vui{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:46;display:none;align-items:center;gap:8px;padding:0 16px;background:var(--bar,#0d1120);color:#fff}

#vspin{position:fixed;top:calc(50% - 32px);left:50%;transform:translate(-50%,-50%);z-index:45;display:none;pointer-events:none}

.cs-badge{position:absolute;top:10px;right:10px;background:#ff0033;color:#fff;font-size:9.5px;font-weight:900;letter-spacing:1.5px;padding:3px 9px;border-radius:99px;box-shadow:0 2px 10px rgba(255,0,51,.4)}

.prow{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 0}

/* Grafische Scan-Anzeige (Einstellungen) */
.sbig{margin:4px 0 12px}

.sbig-txt{font-size:12.5px;color:var(--mut);margin-top:6px}

.srow{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);margin-bottom:8px}

/* ---- Kurations-Seiten (Serien / Klassiker / Schauspieler) ---- */

  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.personhero .ph{position:relative;z-index:2;align-self:stretch;flex:1;min-width:0;max-width:620px;align-self:flex-end;padding:16px 26px;background:rgba(10,13,22,.86);border-radius:0 16px 16px 0;border-left:1px solid var(--line)}

  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.castrow{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 10px;margin:2px 0 10px}

.ptile:hover{transform:translateY(-2px);border-color:var(--acc2)}

.ptile .tsub{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:11px;line-height:1.3;background:rgba(8,10,16,.82);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.castrow .cp .r{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* --- Geburtstage: hochwertige Karten-Ansicht --- */
.bday-hero{position:relative;border-radius:18px;overflow:hidden;padding:26px 28px;margin-bottom:22px;
  background:linear-gradient(135deg,rgba(232,177,60,.16),rgba(79,140,255,.10) 55%,rgba(232,177,60,.05));
  border:1px solid rgba(232,177,60,.25)}

  background:radial-gradient(600px 200px at 85% -20%,rgba(232,177,60,.18),transparent 60%)}

.bday-hero h2{margin:0;font-size:24px;font-weight:800;letter-spacing:.3px}

  box-shadow:0 4px 16px rgba(232,177,60,.35)}
.bday-pill:hover{border-color:var(--acc)}
.bday-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.bday-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}

/* --- Hochwertige Reihen (Netflix/HBO-Stil): versteckte Scrollbar + Pfeile --- */
.brow{position:relative}

/* Separate App-Aktion, bewusst nicht Teil der Navigation */
.shutdown-btn{
    position:absolute;
    top:7px;
    right:16px;
    margin:0;
    background:transparent;
    color:var(--mut);
    border:1px solid transparent;
    padding:6px 9px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    font-weight:500;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background .15s,color .15s,border-color .15s;

    background:var(--card);

    height:16px;

    }

const gb = n=>{if(!n)return'';const g=n/1e9;if(g>=1)return g.toFixed(2)+' GB';return (n/1e6).toFixed(0)+' MB'};
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2600)}
let _req=0;
const _jcache=new Map(),_JTTL=5000;
// Daten, die sich durch Telegram-Scan/TMDB-Matching ändern, nie lang cachen.
const _jskip=/^\/(api\/status|api\/progress|api\/scan(?:\/|\b)|api\/groups(?:\b|\/)|api\/media(?:\/|\b)|api\/player|api\/films(?:\/|\?|\b)|api\/series(?:\/|\?|\b)|api\/top10|api\/hubs(?:\/|\?|\b)|api\/charts(?:\/|\?|\b)|api\/facets(?:\/|\?|\b)|api\/theaters(?:\/|\?|\b)|api\/people(?:\/|\?|\b)|api\/films\/latest)/;
async function j(u,o){
  const my=_req;
  if(!o&&!u.match(_jskip)){
    const h=_jcache.get(u);
    if(h&&Date.now()-h.t<_JTTL){if(my!==_req)throw {isStale:1};return h.data;}
  }
  const r=await fetch(API+u,o);
  if(my!==_req)throw {isStale:1};
  const d=await r.json();
  if(!o){if(r.ok)_jcache.set(u,{t:Date.now(),data:d});}
  else _jcache.clear();
  return d;
}

  const code=($('#acctcode').value||'').trim();
  if(!label){acctMsg('Bitte zuerst ein Label vergeben.');return;}
  acctDisable(true);
  try{
      if(code){
        const r=await j('/api/tgauth/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,code})});
        if(r.ok){acctMsg('✅ '+label+' angemeldet.');_loginPending=null;$('#acctcode').value='';acctsRefresh();}
        else acctMsg('Sign-in fehlgeschlagen',r.error||'Code falsch oder abgelaufen?');

        if(r.error){acctMsg('Login nicht gestartet',r.error);}

let _heroTick=0;
function pickHero(arr){
  const cand=(arr||[]).filter(f=>f.backdrop_path&&f.title&&(!f.original_title||f.original_title.toLowerCase()===f.title.toLowerCase()));
  if(!cand.length) return null;
  const top=cand.sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,12);
  _heroTick++;
  return top[_heroTick % top.length];
}
function heroObj(it, tag){
  return richHero({id:it.id,title:it.title,year:it.year,overview:it.overview,rating:it.rating,genres:it.genres||'',backdrop_path:it.backdrop_path,poster_path:it.poster_path,trailer:it.trailer||''},tag);
}
function bindHeroRotate(b, arr, tag){
  const cand=(arr||[]).filter(f=>f.backdrop_path&&f.title&&(!f.original_title||f.original_title.toLowerCase()===f.title.toLowerCase())).sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,12);
  if(cand.length<2) return;
  let i=0;
  clearInterval(window._heroTimer);
  window._heroTimer=setInterval(()=>{
    i=(i+1)%cand.length;
    const strip=b.querySelector('.hero-strip');
    if(!strip) return;
    const wrap=document.createElement('div'); wrap.innerHTML=heroObj(cand[i],tag);
    strip.replaceWith(wrap.firstElementChild);
    const ns=b.querySelector('.hero-strip');
    if(ns){ ns.querySelectorAll('[data-hero-play]').forEach(bb=>bb.onclick=()=>{const f=arr.find(x=>x.id==+bb.dataset.heroPlay); if(f&&(f.kind==='tv'||f.kind==='series'))openSeries(+bb.dataset.heroPlay);else openFilm(+bb.dataset.heroPlay);}); ns.querySelectorAll('[data-hero-trailer]').forEach(bt=>bt.onclick=()=>{const tr=bt.dataset.tr,tt=bt.dataset.tt;if(tr)trailerOverlay({trailer:tr,title:tt});else toast('Kein Trailer')}); }
  }, 8000);
}

    const upd=()=>{
      const l=brow.querySelector('.brow-arrow.l'), r=brow.querySelector('.brow-arrow.r');
      if(l)l.classList.toggle('dis',track.scrollLeft<=2);

let HERO=[],heroI=0,heroT=null;
async function loadHero(){
  // Kino-Starter (frischestes Release-Jahr zuerst) + die letzten Neuzugaenge
  let fresh=[],kino=[];
  try{fresh=(await j('/api/films/latest')).films||[];}catch(e){}
  try{
    const t=(await j('/api/theaters')).items||[];
    kino=t.filter(x=>x.film_id&&(!x.size_bytes||x.size_bytes<1.6e9)).slice(0,3)
          .map(x=>({id:x.film_id,title:x.title,year:x.year,overview:x.overview,rating:x.rating,
                    poster_path:x.poster_local,backdrop_path:x.backdrop_path,trailer:'',kind:'movie',genres:'',kino:1}));
  }catch(e){}
  const seen=new Set(kino.map(k=>k.id));
  HERO=[...kino,...fresh.filter(f=>!seen.has(f.id))].slice(0,7);
}

    const tr=slide.trailer&&slide.trailer!=='none'?slide.trailer:'';

    </div></div>`;
}
function heroWire(){
  if(!HERO.length)return;
  const s=()=>HERO[heroI%HERO.length];
  const srcMid=async fid=>{
    const {items}=await j('/api/films/'+fid);
    if(items&&items.length){const m=items.find(x=>x.dl_status==='done')||items[0];return m.id}
    return 0;
  };
  const hp=$('#hplay'); if(hp)hp.onclick=async()=>{const f=s();const mid=await srcMid(f.id);
    mid?playMedia(mid,null,f.title,null,{name:f.title+(f.year?` (${f.year})`:''),meta:f.genres||f.date||'',desc:f.overview||'',still:f.poster_path?`/posters/${f.poster_path}`:''}):toast('Keine Quelle')};
  const ht=$('#htrailer'); if(ht)ht.onclick=async()=>{const f=s();
    if(f.trailer&&f.trailer!=='none')return trailerOverlay(f);
    const d=await j('/api/films/'+f.id); if(d.film&&d.film.trailer&&d.film.trailer!=='none'){f.trailer=d.film.trailer;trailerOverlay(f)}
    else toast('Kein Trailer gefunden');};
  const hi=$('#hinfo'); if(hi)hi.onclick=()=>openFilm(s().id);
  document.querySelectorAll('.hdots i').forEach(d=>d.onclick=()=>{heroI=+d.dataset.i;refreshHero()});
  clearInterval(heroT);
  const tick=()=>{
    if((state.view!=='lib'&&state.view!=='home')||!document.querySelector('#heroSlot .hero-strip')){clearInterval(heroT);return}
    heroI++;refreshHero();
  };
  const cur=HERO[heroI%HERO.length];
  const hasTr=cur&&cur.trailer&&cur.trailer!=='none';
  heroT=setTimeout(tick, hasTr?18000:7000);
}
async function refreshHero(){
  if(!HERO.length) await loadHero();
  // Trailer fuer die aktuelle Slide nachladen, falls noch keiner da ist (Nutzer:
  // 'moeglichst immer mit Trailer zeigen'). Ergebnis wird im HERO-Objekt gecacht.
  const cur=HERO[heroI%HERO.length];
  if(cur && !(cur.trailer&&cur.trailer!=='none')){
    try{
      const d=await j('/api/films/'+cur.id);
      if(d.film&&d.film.trailer&&d.film.trailer!=='none'){cur.trailer=d.film.trailer;}
    }catch(e){}
  }
  const html=await renderHero();
  const slot=$('#heroSlot'); if(slot) slot.innerHTML=html;
  heroWire();
}

async function homeRowsHtml(){

    const byG={};
    all.forEach(f=>{(f.genres||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(g=>{(byG[g]=byG[g]||[]).push(f);});});
    const gs=Object.entries(byG).sort((a,b)=>(b[1]||[]).length-(a[1]||[]).length).slice(0,6);

    s+=top10row;

    s+=klass.length?cinRow('🎬 Klassiker', rowCards(dedup(klass,used)),'home-klass'):'';
    s+=cinRow(icPlay+'Neu in deiner Sammlung', rowCards(dedup(latest,used)),'home-latest');
    s+=cinRow(icPlay+'Beliebteste', rowCards(dedup(bel,used)),'home-bel');

function fskPill(f){
  const v=(f&&f.fsk)||'';
  const c=v==='0'?'g':v==='6'?'t':v==='12'?'y':v==='16'?'o':v==='18'?'r':'u';
  return `<span class="fsk ${c}" title="Altersfreigabe (FSK)">${v?('FSK '+v):'FSK ?'}</span>`;
}
// FSK-Badge auf der Karte: offizielle FSK-Web-Piktogramme (PNG aus assets/fsk,
// lokal serviert). Bekannte Freigabe -> farbiges Piktogramm; unbekannt -> 'FSK folgt'.
function fskBadge(f){
  const raw=((f&&f.fsk)||'').toString().trim();
  const n=raw.match(/\d+/)?.[0]||'';
  return `<span class="wfsk ${n?'known':''}" title="Altersfreigabe (FSK)">${n?'FSK '+n:'FSK ?'}</span>`;
}
function variantMeta(m){
  const tags=[];
  if(m.quality) tags.push(m.quality);
  if(m.release_type) tags.push(m.release_type);
  if(m.codec) tags.push(m.codec);
  if(m.width&&m.height&&!m.quality) tags.push(`${m.width}×${m.height}`);
  if(m.audio_lang) tags.push(m.audio_lang.replaceAll('+',' / '));
  if(Number(m.hdr)) tags.push('HDR');
  if(Number(m.subtitles)) tags.push('UT');
  return tags.length?`<div class="vmeta">${tags.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}</div>`:'';
}

window.__vrect=()=>{

function saveProgress(s){

}

async function vtick(){
  let s;try{s=await j('/api/player/state');}catch(e){return}
  // 'Folge neu starten'-Automat: VLC zeigt Playing, aber die Uhr steht seit >=6s
  // UND der Cache hat langlich Vorsprung (Loader ist vorbei, Demuxer haengte an
  // alter Frontier) -> 4s weiter-spulen. Genau der Handgriff, den man sonst manuell
  // macht — nur ohne Nutzer. Bei duennem Cache NICHT nudgen, das wuerde nur ringen.
  if(VTHEATER()&&s.open&&s.state==='State.Playing'){
    if(_vprev!==null&&s.time===_vprev){
      _vstuck+=700;
      if(_vstuck>=6000&&Date.now()-_vnudgeT>15000){
        _vstuck=0;_vnudgeT=Date.now();
        try{const c=await j('/api/media/'+_vmid+'/cachestate');
          if(c.open&&s.length&&c.pos>c.total*(s.time/s.length)+5*1048576){
            vcmd('seekto',s.time+4000);}}catch(e){}
      }
    } else _vstuck=0;
    _vprev=s.time;
  } else {_vprev=null;_vstuck=0}
  if(VPL&&s.open&&s.embed&&s.qpos!==undefined){
    const nc=(VPL.state&&VPL.state.qpos)!==s.qpos;
    VPL.state={qpos:s.qpos,auto:s.auto};
    if(nc){plDraw();infoSet(infoFor(s.qpos));
      document.body.classList.add('info');$('#vinfoBtn').classList.add('on');infoRender();
      clearTimeout(_vinT);_vinT=setTimeout(()=>infoToggle(false),18000);}
  }
  if(!s.open)return;
  _vlen=s.length||0;
  const t=(s.time||0)/1000;
  $('#vtime').textContent=fmtT(t)+' / '+fmtT(_vlen/1000);
  if(s.vw&&s.vh){const _r=s.vh>=1080?'FHD':(s.vh>=720?'HD':(s.vh>=480?'SD':'LD'));$('#vres').textContent=_r;}
  const _pp=s.buffering?'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>':(s.state==='State.Playing'?'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l11-6.86a1.05 1.05 0 0 0 0-1.8l-11-6.86A1.05 1.05 0 0 0 8 5.14z"/></svg>');
  $('#vplay').innerHTML=_pp;
  const p=_vlen?Math.min(1,s.time/_vlen):0;
  $('#vpos').style.width=(p*100)+'%';$('#vknob').style.left=(p*100)+'%';
  saveProgress(s);   // Netflix-Fortschrittsbalken periodisch fortschreiben
  // Direkter Playerbetrieb: kein Vorlauf und kein Cache-Startpfad.
  const spin=s.buffering||s.state==='State.Buffering';
  $('#vspin').style.display=spin?'flex':'none';
  const fb=($('#vfeed')||{});
  if(s.state==='State.Playing'||!s.buffering||!(s.feed>0)){
    if(fb.style)fb.style.display='none';
  } else if(fb.style){
    fb.textContent='⏳ Verbindung liefert nur '+s.feed.toFixed(2).replace('.',',')+' MB/s — puffert auf';
    fb.style.display='inline';
  }
  window._valt=s.alt||null;window._vtest=!!s.test;
  const ab=$('#valt');
  if(ab){
    if(s.alt&&s.buffering){
      ab.textContent='Leichtere Fassung — nur '+s.alt.mb+' MB → wechseln';
      ab.style.display='inline-block';
    } else ab.style.display='none';
  }
}

      }catch(e){}
      await new Promise(r=>setTimeout(r,900));
    }
  }

  $('#vpl-auto-c').onchange=e=>{if(VPL)VPL.auto=e.target.checked;vcmd('auto',e.target.checked?1:0);};
  $('#vfull').onclick=()=>{
      // Echt-App-Fenster: das NATIVE pywebview-Fenster vollbilden. Element-
      // Fullscreen (requestFullscreen) wirkt in einem echten App-Fenster nicht.
      try{
        if(window.pywebview&&window.pywebview.api&&window.pywebview.api.toggle_fs){
          window.pywebview.api.toggle_fs();
                    _vFull=!document.fullscreenElement;
                    $('#vfull').innerHTML=_vFull?'<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';
                    return;
        }
      }catch(e){}
      const el=document.documentElement;
      if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen().catch(()=>{});
    };
  const sk=$('#vseek');
  const jump=e=>{if(!_vlen)return;const r=sk.getBoundingClientRect();
    vcmd('seekto',Math.round(_vlen*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))));};
  sk.addEventListener('click',jump);
  $('#vbox').addEventListener('click',()=>vcmd('toggle'));
  document.addEventListener('fullscreenchange',()=>{
    const fs=!!document.fullscreenElement;
    // #vbox-Inset bleibt IMMER 0 0 64px 0 — wirde der Video-Host (liegt als
    // echtes Windows-Fenster UEBER dem Web) ueber die Leiste gelegt, ist die
    // Steuerung im Vollbild unsichtbar und unbedienbar ('unbrauchbar').
    $('#vfull').innerHTML=fs?'<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>';});
  document.addEventListener('keydown',e=>{
    if(!VTHEATER())return;
    if(e.target.tagName==='INPUT')return;
    if(e.code==='Space'){e.preventDefault();vcmd('toggle');}
    else if(e.key==='i'||e.key==='I'){infoToggle();}
    else if(e.key==='ArrowLeft'){vcmd('seek',-10);}
    else if(e.key==='ArrowRight'){vcmd('seek',10);}
    else if(e.key==='f'||e.key==='F'){$('#vfull').click();}
    else if(e.key==='Escape'&&document.fullscreenElement){/* Exit macht der Browser */}
    else if(e.key==='Escape'){stopPlayer();}
  });
})();

async function openAssign(mid){
  $('#modal').classList.add('open');
  $('#sheet').style.maxWidth='';
  $('#sheet').innerHTML=`
    <div style="padding:14px 16px;display:flex;gap:10px;align-items:center">
      <b style="flex:1">Zuordnung korrigieren</b>
      <button class="btn sec" id="aclear">Zuordnung loesen</button>
      <button class="btn sec" onclick="closeModal()">✕</button>
    </div>
    <div style="padding:0 16px 14px"><input type="search" id="aq" placeholder="Filmtitel suchen (TMDB)…" autofocus style="width:100%"></div>
    <div id="ares" style="padding:0 16px 16px;max-height:60vh;overflow:auto"></div>`;
  const res=$('#ares'), q=$('#aq');
  let deb;
  const go=async()=>{
    const s=q.value.trim();
    if(s.length<2){res.innerHTML='<div class="empty" style="padding:20px">Titel eintippen…</div>';return}
    res.innerHTML='<div class="empty" style="padding:20px">Suche…</div>';
    const {results}=await j('/api/tmdb/search?q='+encodeURIComponent(s));
    res.innerHTML=results.length?results.map(r=>`
      <div class="src" style="align-items:flex-start">
        ${r.poster_path?`<img src="https://image.tmdb.org/t/p/w92${esc(r.poster_path)}" style="width:56px;border-radius:6px" loading="lazy">`:'<div style="width:56px"></div>'}
        <div class="meta"><div class="fn">${esc(r.title)} (${r.year||''}) · ${r.kind==='tv'?'Serie':'Film'}</div>
          <div class="sub">${esc(r.overview||'')}</div></div>
        <button class="btn mini" data-pick='${JSON.stringify({tmdb_id:r.tmdb_id,kind:r.kind})}'>✓</button>
      </div>`).join(''):'<div class="empty" style="padding:20px">Keine Treffer</div>';
    res.querySelectorAll('[data-pick]').forEach(pb=>pb.onclick=async()=>{
      const body=JSON.parse(pb.dataset.pick);
      const r=await j(`/api/media/${mid}/assign`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.ok){toast('Zugeordnet');stopPlayer();if(window._assignFilm)openFilm(window._assignFilm);}
      else toast(r.error||'Fehler');
    });
  };
  q.oninput=()=>{clearTimeout(deb);deb=setTimeout(go,350)};
  const pre=(window._assignQ||'').slice(0,60);
  q.value=pre; go();
  $('#aclear').onclick=async()=>{
    const r=await j(`/api/media/${mid}/assign`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clear:true})});
    if(r.ok){toast('Geloest — Matcher versucht erneut');stopPlayer();closeModal();}
  };
}

function watch(dlid,btn){
  const t=setInterval(async()=>{
    const p=await j('/api/downloads/'+dlid);
    const bar=document.querySelector('.bar');
    if(p.status==='running'&&bar){bar.style.display='block';bar.firstElementChild.style.width=(p.bytes_total?(p.bytes_done/p.bytes_total*100):2)+'%'}
    if(p.status==='done'){clearInterval(t);btn.outerHTML='<span class="badge done">✓ offline</span>';toast('Fertig – offline verfügbar')}
    if(p.status==='error'){clearInterval(t);btn.disabled=false;toast('Fehler: '+(p.error||''))}
  },1200);
}

/* ---------- Gruppen ---------- */
let gFilter={q:'',tab:'all'}, gSort='vid';
const FILMTAB=['film','serie','hd','kino','cine','movie','full','arche','gold','dergute','tv'];
function renderGroups(){_gRender()}
async function _gRender(){
  $('#page').innerHTML='<div class="empty">Gruppen werden geladen…</div>';
  let {groups,telegram}=await j('/api/groups');
  const st=await j('/api/scan/state'); const sm={}; st.states.forEach(s=>sm[s.chat_id]=s);
  if(!groups.length){
    $('#page').innerHTML=`<div class="empty"><h2>${telegram?'Keine Gruppen im Index':'Nicht verbunden'}</h2>
      <p>${telegram?'Lade deine Gruppen neu.':'Session fehlt — in data/config.json eintragen.'}</p>
      <button class="btn" id="ref">Gruppen laden</button></div>`;
    $('#ref').onclick=async()=>{toast('Lade…');const r=await j('/api/groups/refresh',{method:'POST'});r.ok?_gRender():toast('Fehler: '+r.error)};
    return;
  }
  const vidsOf=cid=>sm[cid]?(sm[cid].videos_seen||0):0;
  const anyBusy=Object.values(sm).some(s=>s.status==='running'||s.status==='queued');
  const sel=new Set(groups.filter(g=>g.chosen).map(g=>g.chat_id));
  $('#page').innerHTML=`
   ${themeHero('<svg viewBox="0 0 24 24"><path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/></svg>','Gruppen',`${groups.length} Gruppen · ${sel.size} ausgewählt`,'')}
   <div class="toolbar">
     <input type="search" id="gq" placeholder="Gruppe suchen…" value="${esc(gFilter.q)}">
     <select id="gsort">
       <option value="vid">Sortieren: die meisten Videos</option>
       <option value="name">Sortieren: Name A–Z</option>
       <option value="unscanned">Zuerst: noch nicht gescannt</option>
     </select>
     <button class="btn" id="start" ${anyBusy?'disabled':''}><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg><span>Ausgewählte scannen</span></button>
     <button class="btn sec" id="rescanAll" title="Prueft bei allen gewaehlten Gruppen auf neue Videos"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg><span>Gewählte auf Neues prüfen</span></button>
     <button class="btn sec" id="refresh"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg><span>Gruppenliste auffrischen</span></button>
        </div>
   <div class="toolbar" id="gtabs">
     ${[['all','Alle'],['sel','Ausgewählt'],['vid','Mit Videos'],['un','Ohne Videos'],['fi','Film-artig']].map(([k,l])=>
       `<button data-t="${k}" class="${gFilter.tab===k?'on':''}">${l}</button>`).join('')}
     <button class="btn sec" id="all" style="margin-left:auto">☑ Alle sichtbaren an/ab</button>
   </div>
   <div id="pcardSlot">${progCard()}</div>
   <div class="grouplist" id="glist"></div>
   <div style="color:var(--mut);font-size:13px;padding:8px 2px" id="hint"></div>`;
  let _persist; const persist=()=>{clearTimeout(_persist);_persist=setTimeout(async()=>{
    try{
      const r=await j('/api/groups/choose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_ids:[...sel]})});
      if(r&&r.auto_scanned){toast(`${r.auto_scanned} neu gewählte Gruppe${r.auto_scanned>1?'n':''} werden sofort eingelesen…`);pollGroups();}
    }catch(e){}
  },600)};
  const updCount=n=>$('#hint').textContent=`${n} sichtbar · ${sel.size} ausgewählt · ${groups.length} Gruppen gesamt · <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor;vertical-align:-2px;margin-right:6px"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>scannt nur diese Gruppe`;
  const draw=()=>{
    let list=groups.slice();
    const q=gFilter.q.toLowerCase();
    if(q) list=list.filter(g=>(g.title||'').toLowerCase().includes(q)||(g.username||'').toLowerCase().includes(q));
    if(gFilter.tab==='sel')list=list.filter(g=>sel.has(g.chat_id));
    if(gFilter.tab==='vid')list=list.filter(g=>vidsOf(g.chat_id)>0);
    if(gFilter.tab==='un')list=list.filter(g=>vidsOf(g.chat_id)===0);
    if(gFilter.tab==='fi')list=list.filter(g=>FILMTAB.some(k=>(g.title||'').toLowerCase().includes(k)));
    if(gSort==='vid')list.sort((a,b)=>vidsOf(b.chat_id)-vidsOf(a.chat_id));
    if(gSort==='name')list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','de'));
    if(gSort==='unscanned')list.sort((a,b)=>((sm[a.chat_id]?1:0)-(sm[b.chat_id]?1:0))||vidsOf(b.chat_id)-vidsOf(a.chat_id));
    $('#glist').innerHTML=list.map(g=>{
      const s=sm[g.chat_id]; const v=vidsOf(g.chat_id);
      const stTxt=s?({running:'läuft…',queued:'wartet',done:'fertig',error:'Fehler',idle:'—',skipped:'uebersprungen'}[s.status]||s.status):'—';
      return `<div class="grow ${sel.has(g.chat_id)?'sel':''}" data-cid="${g.chat_id}">
       <div class="chk">✓</div>
       <div class="gt"><div class="n">${esc(g.title)}${v?` <span class="badge">${v} Videos</span>`:''}${s&&s.status==='done'?' <span class="badge done">gescannt</span>':''}</div>
         <div class="u">${g.username?'@'+esc(g.username):g.type}${s&&s.last_scan_at?' · zuletzt '+new Date(s.last_scan_at*1000).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</div>
         ${s&&s.status==='error'&&s.error?`<div class="u" style="color:var(--err)">${esc((s.error||'').slice(0,90))}</div>`:''}
         ${s&&s.status==='running'?'<div class="bar" style="display:block"><i style="width:8%"></i></div>':''}
       </div>
       <div class="st ${s?s.status:''}">${stTxt}</div>
       <button class="btn sec mini" data-scan="${g.chat_id}" title="Nur diese Gruppe (erneut) scannen">⚡ Scannen</button>
     </div>`}).join('')||'<div class="empty">Keine Treffer — Suche oder Filter anpassen</div>';
    updCount(list.length);
    $('#glist').querySelectorAll('.grow .chk').forEach(el=>el.onclick=()=>{
      const row=el.closest('.grow'); const cid=+row.dataset.cid;
      sel.has(cid)?sel.delete(cid):sel.add(cid);
      row.classList.toggle('sel'); updCount($('#glist').querySelectorAll('.grow').length); persist();
    });
    $('#glist').querySelectorAll('[data-scan]').forEach(b=>b.onclick=async()=>{
      const cid=+b.dataset.scan;
      if(!sel.has(cid)){sel.add(cid);b.closest('.grow').classList.add('sel');persist();}
      await j('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_ids:[cid],force:true})});
      toast('Gruppe wird gescannt'); pollGroups();
    });
  };
  $('#gq').oninput=e=>{gFilter.q=e.target.value;draw()};
  $('#gsort').value=gSort;
  $('#gsort').onchange=e=>{gSort=e.target.value;draw()};
  $('#gtabs').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    gFilter.tab=b.dataset.t;$('#gtabs').querySelectorAll('[data-t]').forEach(x=>x.classList.remove('on'));b.classList.add('on');draw()});
  $('#all').onclick=()=>{
    const rows=[...$('#glist').querySelectorAll('.grow')].map(r=>+r.dataset.cid);
    const anyOff=rows.some(cid=>!sel.has(cid));
    rows.forEach(cid=>anyOff?sel.add(cid):sel.delete(cid));
    draw(); persist();
  };

  $('#start').onclick=async()=>{
    if(!sel.size)return toast('Bitte Gruppen auswählen');
    persist();
    const r=await j('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_ids:[...sel]})});
    if(!r.queued){
      toast('Alle ausgewählten Gruppen sind bereits gescannt — für neue Videos ⟳ „Gewählte auf Neues prüfen“ benutzen');
    }else{ toast('Scan gestartet'); pollGroups(); }
  };
  $('#rescanAll').onclick=async()=>{
    persist();
    await j('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({force:true})});
    toast('Alle gewählten Gruppen werden auf neue Videos geprüft'); pollGroups();
  };
  $('#refresh').onclick=async()=>{toast('Lade Gruppen… (kann dauern)');const r=await j('/api/groups/refresh',{method:'POST'});r.ok?_gRender():toast('Fehler: '+r.error)};
  draw();
  if(anyBusy)pollGroups();
}
let _pg=null;
async function pollGroups(){
  clearInterval(_pg);
  _pg=setInterval(async()=>{
    if(state.view!=='groups'){clearInterval(_pg);return}
    const st=await j('/api/scan/state');
    const sm={};st.states.forEach(s=>sm[s.chat_id]=s);
    let busy=false;
    Object.entries(sm).forEach(([cid,s])=>{
      const row=document.querySelector(`.grow[data-cid="${cid}"]`); if(!row)return;
      const el=row.querySelector('.st'); const txt={running:'läuft…',queued:'wartet',done:'fertig',error:'Fehler',idle:'—',skipped:'uebersprungen'}[s.status]||s.status;
      el.className='st '+(s.status||''); el.textContent=txt; busy=busy||s.status==='running'||s.status==='queued';
    });
    if(!busy){clearInterval(_pg);_gRender()}
  },3000);
}

/* ---------- Downloads (Manager) ---------- */
let dlFilter='active';
async function renderDl(){
  const {downloads,stats,max_concurrent}=await j('/api/downloads');
  const S=st=>({running:'Läuft',queued:'Wartend',paused:'Pausiert',done:'Fertig',error:'Fehler',canceled:'Abgebrochen'}[st]||st);
  const cnt=k=>(stats[k]||{}).count||0;
  const totB=(stats.done||{}).done||0;
  const gb2=n=>n>1e9?(n/1e9).toFixed(2)+' GB':(n/1e6).toFixed(0)+' MB';
  const tabs=[['active','Aktiv',cnt('running')+cnt('queued')+cnt('paused')],
              ['done','Fertig',cnt('done')],['error','Fehler/Abbr.',cnt('error')+cnt('canceled')],['all','Alle',downloads.length]];
  let list=downloads;
  if(dlFilter==='active')list=downloads.filter(d=>['running','queued','paused'].includes(d.status));
  if(dlFilter==='done')list=downloads.filter(d=>d.status==='done');
  if(dlFilter==='error')list=downloads.filter(d=>['error','canceled'].includes(d.status));
  $('#page').innerHTML=`
   <div class="pcard"><h3>Download-Manager</h3>
    <div class="pgrid">
      <div class="pstat"><div class="v">${cnt('running')}/${max_concurrent||2}</div><div class="k">gleichzeitig</div></div>
      <div class="pstat"><div class="v">${cnt('queued')}</div><div class="k">wartend</div></div>
      <div class="pstat"><div class="v">${cnt('paused')}</div><div class="k">pausiert</div></div>
      <div class="pstat"><div class="v">${cnt('done')}</div><div class="k">fertig · ${gb2(totB)}</div></div>
      <div class="pstat"><div class="v">${cnt('error')+cnt('canceled')}</div><div class="k">Fehler/Abbruch</div></div>
    </div>
    <div id="dltabs" style="display:flex;gap:6px;flex-wrap:wrap">
     ${tabs.map(([k,l,n])=>`<button data-t="${k}" class="${dlFilter===k?'on':''}" style="background:${dlFilter===k?'var(--acc)':'var(--card2)'};color:${dlFilter===k?'#111':'var(--mut)'};border:1px solid var(--line);padding:6px 13px;border-radius:99px;cursor:pointer;font-size:13px">${l} (${n})</button>`).join('')}
    </div>
   </div>
   <div class="grouplist">${list.map(d=>{
    const pct=d.bytes_total?Math.min(100,Math.round((d.bytes_done||0)/d.bytes_total*100)):0;
    return `<div class="grow" style="flex-wrap:wrap"><div class="gt">
      <div class="n">${esc(d.film_title||d.filename||'Download')} <span class="badge ${d.status==='done'?'done':''}">${S(d.status)}</span></div>
      <div class="u">${esc(d.chat_title||'')}${d.size_bytes?' · '+gb2(d.size_bytes):''}${d.status==='running'&&d.speed?` · ${(d.speed/1e6).toFixed(1)} MB/s · noch ~${d.eta_s>=90?Math.round(d.eta_s/60)+' Min':d.eta_s+' s'}`:''}</div>
      ${['running','queued','paused','done'].includes(d.status)&&d.bytes_total?`<div class="bar" style="display:block"><i style="width:${pct}%"></i></div>`:''}
      ${d.error?`<div class="u" style="color:var(--err)">${esc(d.error)}</div>`:''}
      ${d.path?`<div class="u" style="color:var(--ok);word-break:break-all">${esc(d.path)}</div>`:''}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${d.status==='running'||d.status==='queued'?`<button class="btn sec mini" data-act="pause" data-id="${d.id}">⏸ Pause</button>
        <button class="btn sec mini" data-act="cancel" data-id="${d.id}">✕</button>`:''}
      ${d.status==='paused'?`<button class="btn mini" data-act="resume" data-id="${d.id}"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7-1.4-1.4L13.2 12 7.6 6.4 9 5z"/></svg><span>Weiter</span></button>
        <button class="btn sec mini" data-act="cancel" data-id="${d.id}">✕</button>`:''}
      ${d.status==='error'||d.status==='canceled'?`<button class="btn mini" data-act="retry" data-id="${d.id}"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg><span>Erneut</span></button>`:''}
      ${d.status==='done'&&d.media_id?`<button class="btn mini" data-play="${d.media_id}"><svg viewBox="0 0 24 24"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l11-6.86a1.05 1.05 0 0 0 0-1.8l-11-6.86A1.05 1.05 0 0 0 8 5.14z"/></svg><span>Abspielen</span></button>`:''}
    </div></div>`}).join('')
    ||'<div class="empty">Keine Einträge in dieser Ansicht</div>'}</div>`;
  $('#dltabs').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{dlFilter=b.dataset.t;renderDl()});
  $('#page').querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    await j(`/api/downloads/${b.dataset.id}/${b.dataset.act}`,{method:'POST'});
    renderDl();
  });
  $('#page').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playMedia(+b.dataset.play,null,'Download'));
  if(downloads.some(d=>d.status==='running'||(dlFilter==='active'&&downloads.some(d=>d.status==='queued'))))
      setTimeout(()=>{if(state.view==='dl')renderDl()},2500);
  }

  /* ---------- Mediathek: fertige Downloads als schaubare Bibliothek ---------- */
  async function renderMed(){
    const {items,count,total_gb}=await j('/api/library');

let PROG=null,stripI=0,_lastLiveItems=null,_lastLiveFilms=null,_lastLiveScan='',_lastLiveScanActive=false,_liveRenderAt=0,_liveRenderBusy=false;
async function pollProgress(){
  try{PROG=await j('/api/progress');}catch(e){return}
  // Interne Testwiedergaben bleiben technisch verfügbar, aber unsichtbar.
  // Die Oberfläche soll keine Debug-/Testzustände anzeigen.
  let ps=null;
  try{ps=await j('/api/player/state');}catch(e){}
  const tb=$('#testbar');
  if(tb)tb.style.display='none';
  document.body.classList.remove('teston');
  // Laeuft hinten ein Player (Test des Assistenten, Start von aussen, oder die
  // Oberflaeche wurde neu geladen), muss das Theater sichtbar sein. Das gehoert
  // in den IMMER laufenden Poller — vtick laeuft nur, wenn das Theater schon offen ist.
  if(ps&&ps.open&&ps.embed&&!VTHEATER()){
    if(ps.mid)_vmid=ps.mid;
    theaterOpen(ps.title||'');
    if((ps.time||0)>500){document.body.classList.remove('intro');const st=$('#vstat');if(st)st.textContent='';}
  }
  const liveView=['home','lib','series'].includes(state.view);
  const modalOpen=$('#modal')&&$('#modal').classList.contains('open');
  const liveScan=JSON.stringify([PROG.done,PROG.queued,PROG.running,PROG.errored,PROG.tmdb_wait]);
    const scanActive=!!(PROG.running&&PROG.running.length||PROG.queued>0);
    const scanFinished=_lastLiveScanActive&& !scanActive;
    // Während des Scans niemals die ganze Ansicht neu aufbauen. Das würde Scrollposition,
    // Hoverzustand und offene UI-Zustände sichtbar zurücksetzen. Einmalig nach Abschluss
    // werden Filme/Serien aktualisiert.
    if(scanFinished&&liveView&&!modalOpen&&!VTHEATER()&&!_liveRenderBusy){
      _liveRenderBusy=true;_liveRenderAt=Date.now();
      Promise.resolve(render()).catch(()=>{}).finally(()=>{_liveRenderBusy=false;});
    }
  _lastLiveItems=PROG.items;
  _lastLiveFilms=PROG.films;
  _lastLiveScan=liveScan;
  _lastLiveScanActive=scanActive;
  // Statusleiste: NUR die Gesamt-Scanzeit (Nutzer-Wunsch). Die detaillierte
  // Gruppen-Ansicht mit Fortschritt liegt jetzt in den Einstellungen.
  const strip=$('#strip');
  let mainW=100, mainTxt='';
  const etaTxt=m=>m<60?m+' Min':(m/60).toFixed(1)+' h';
  if(PROG.running.length){
    const tot=PROG.done+PROG.queued+PROG.running.length+PROG.errored+PROG.skipped||1;
    mainW=Math.min(100,PROG.done/tot*100);
    mainTxt=`<b>Scan läuft</b> <span class="dim">${PROG.done}/${tot} Gruppen fertig · ${PROG.queued} warten · ~${etaTxt(PROG.eta_min)} übrig</span>`;
  } else if(PROG.queued>0){
    mainTxt=`<b>Scan wartet</b> <span class="dim">${PROG.queued} Gruppen in der Warteschlange</span>`;
  } else {
    mainTxt=`<b>THE BACKROOM</b> <span class="dim">${PROG.films.toLocaleString('de-DE')} Titel in deiner Sammlung</span>`;
  }
  strip.classList.add('show');
  $('#stripFill').style.width=mainW.toFixed(1)+'%';
  $('#stripTxt').innerHTML=mainTxt;
  $('#stripLanes').innerHTML='';
  if(state.view==='groups'){const c=$('#pcard'); if(c) c.innerHTML=progCardInner();}
  if(state.view==='settings'){
    const sp=$('#scanprog'); if(sp) sp.innerHTML=scanProgHtml();
    const fc=$('#fskcov'); if(fc&&!fc.dataset.loaded){fc.dataset.loaded=1;fskCovHtml().then(h=>{if(fc)fc.innerHTML=h;});}
    const st=$('#stats'); if(st&&!st.dataset.loaded){st.dataset.loaded=1;statsHtml().then(h=>{if(st)st.innerHTML=h;});}
  }
  if(state.view==='groups' && (PROG.running.length||PROG.queued>0) && !_pg)pollGroups();
}

async function tickNews(){
  const e=$('#ticktxt'); if(!e)return;
  try{
    const n=await j('/api/ticker');
    if(!n||(!n.items&&!n.birthdays)){e.textContent='';return}
    const parts=[];
    if(n.birthdays&&n.birthdays.length)
      parts.push(`<span style="color:var(--acc2)"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:currentColor;vertical-align:-2px;margin-right:5px"><path d="M12 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-2 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm4 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM5 11h14v2H5v-2zm-1 4h16v2H4v-2zm1 4h14v2H5v-2z"/></svg>Heute: ${n.birthdays.map(b=>esc(b.name)).join(', ')}</span>`);
    const link=it=>it.url&&it.url.startsWith('http')?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:`${esc(it.title)}`;
    if(n.items)parts.push(n.items.map(it=>`${link(it)}<span class="sep">▪</span>`).join(''));
    e.innerHTML=parts.join('<span class="sep">▪</span>');
    // Scrollgeschwindigkeit an die Gesamtdistanz (Inhalt+Container) koppeln:
    // ~40px/s => ruhiges Blättern statt Rasen bei vielen Meldungen.
    try{
      const wrap=$('#tickwrap');
      const w=e.offsetWidth;
      const cont=document.getElementById('tickmar');
      if(wrap&&w>0){
        const cw=(cont&&cont.offsetWidth)||1200;
        const dur=Math.max(90, Math.round((w+cw)/40));
        wrap.style.animationDuration=dur+'s';
      }
    }catch(_err){}
  }catch(err){e.textContent=''}
}

// Detaillierte Scan-Ansicht fuer die Einstellungen: jede Gruppe mit Fortschritt.
function scanProgHtml(){
  const p=PROG||{};
  const tot=(p.done||0)+(p.queued||0)+(p.running||[]).length+(p.errored||0)+(p.skipped||0)||1;
  const pctGrp=Math.round((p.done||0)/tot*100);
  const etaTxt=m=>m<60?m+' Min':(m/60).toFixed(1)+' h';
  const running=(p.running||[]);
  const rows=running.map(r=>`<div class="srow">
    <div class="srow-top"><span class="sdot run"></span><span class="sname">${esc(r.title)}</span><span class="spct">${r.pct}%</span></div>
    <div class="sbar2"><i style="width:${Math.min(100,r.pct)}%"></i></div>
    <div class="srow-meta">${(r.seen||0).toLocaleString('de-DE')}${r.total?' / '+r.total.toLocaleString('de-DE'):''} Nachrichten · ${r.videos} Videos · ${r.rate}/Min · noch ${etaTxt(r.eta_min)}</div>
  </div>`).join('');
  return `<div class="pcard">
    <h3>Scan-Fortschritt</h3>
    <div class="sbig">

/* ---------- Serien ---------- */
async function renderSeries(){
  $('#page').innerHTML=`<div class="toolbar"><input type="search" id="sq" placeholder="Serie suchen…"></div>
    <div id="body"><div class="empty">Lädt…</div></div>`;
  const go=async()=>{
    let {series}=await j('/api/series?limit=5000&q='+encodeURIComponent($('#sq').value||'')); series=series.filter(f=>kidOK(f)&&isDe(f.title));
    const b=$('#body'); if(!b)return;
    if(!series.length){b.innerHTML='<div class="empty">Keine Serien in deiner Sammlung.</div>';return}
  const heroS=series[0]||{};
  const top=[...series].sort((a,b)=>(b.rating||0)-(a.rating||0));
  const fresh=[...series].sort((a,b)=>(b.latest||0)-(a.latest||0));
  const recCard=f=>(f.kind==='tv'||f.kind==='series')?sCard(f):wideCard(f);
  const newEpBadge=s=>s.latest&&(Date.now()/1000-s.latest)<30*86400?'<span class="newb">NEUE FOLGE</span>':'';
  const sCard=s=>`<div class="card seriecard" data-id="${s.id}">
      <div style="position:relative">${coverEl(s)}${newEpBadge(s)}${s.eps?`<span class="eps">${s.eps} Ep${s.seasons>1?` · ${s.seasons} Staffeln`:''}</span>`:''}</div>
      <div class="t" title="${esc(s.title)}">${esc(s.title)}</div>
      <div class="s"><span>${s.year||''}</span><span>${s.rating?`★ ${Number(s.rating).toFixed(1)}`:''}</span></div>
    </div>`;
  const heroItem=pickHero(series);
  const hero=heroItem?heroObj(heroItem,'🔥 Beliebt · Serien'):themeHero('<svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/></svg>','Serien',`${series.length} Serien in deiner Sammlung`,'');
  // Top 10 / Neu hinzugefügt (nummeriert + NEU-Badge)
  const used=new Set();
  const fresh10=fresh.slice(0,10);
  const isNew=s=>s.latest&&(Date.now()/1000-s.latest)<30*86400;
  const top10row=fresh10.length?cinRow('🏆 Top 10 · Neu hinzugefügt', dedup(fresh10,used,10).map((s,i)=>`<div style="position:relative;flex:none">${sCard(s)}<span class="t10n">${i+1}</span>${isNew(s)?'<span class="newb">NEU</span>':''}</div>`).join(''),'s-top10'):'';
  // Kuratierte Reihen: TV-Highlights, Preisgekrönte, Binge, Genre-Kategorien
  const tvHigh=[...series].filter(s=>(s.rating||0)>=7.5).sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,20);
  const preis=[...series].filter(s=>(s.rating||0)>=8).sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,20);
  const binge=[...series].filter(s=>(s.eps||0)>=30).sort((a,b)=>(b.eps||0)-(a.eps||0)).slice(0,20);
  const tvHighRow=tvHigh.length?cinRow('📺 TV-Highlights', dedup(tvHigh,used).map(sCard).join(''),'s-tvhigh'):'';
  const preisRow=preis.length?cinRow('🏆 Preisgekrönte Serien', dedup(preis,used).map(sCard).join(''),'s-preis'):'';
  const bingeRow=binge.length?cinRow('🍿 Serien zum Binge', dedup(binge,used).map(sCard).join(''),'s-binge'):'';
  // Procedural-Serien (CSI, FBI, NCIS, Law & Order, Criminal Minds, ...)
  const procKws=['csi','fbi','ncis','law & order','criminal minds','bones','castle','elementary','mentalist','person of interest','chicago pd','chicago p.d.','the blacklist','blue bloods','hawaii five','magnum','rookie','9-1-1','swat','s.w.a.t.','criminal','detective','krimi','crime','the closer','major crimes','numb3rs','cold case','without a trace','the mentalist'];
  const proc=series.filter(s=>{const ti=(s.title||'').toLowerCase(); const g=(s.genres||'').toLowerCase(); return procKws.some(k=>ti.includes(k)||g.includes(k));}).sort((a,b)=>{const at=procKws.some(k=>(a.title||'').toLowerCase().includes(k))?1:0; const bt=procKws.some(k=>(b.title||'').toLowerCase().includes(k))?1:0; return (bt-at)||((b.rating||0)-(a.rating||0));}).slice(0,20);
  const procRow=proc.length?cinRow('🕵️ Procedural-Serien (CSI, FBI & Co.)', dedup(proc,used).map(sCard).join(''),'s-proc'):'';
  const genreRows=curatedGenreRows(series, _SNAMES, used);
  // Empfehlung: "Weil du X gesehen hast" (echter Schauverlauf)
  let recRow='';
  try{ const recd=await j('/api/recommend'); if(recd&&recd.rows) recRow=recd.rows.map((r,i)=>{const rf=dedup(r.films,used,20); return rf.length?cinRow(`Weil du „${esc(r.ref.title)}“ gesehen hast`, rf.map(recCard).join(''),'s-rec'+i):'';}).join(''); }catch(e){}
  b.innerHTML=`
    ${hero}
    ${top10row}
    ${recRow}
    ${dedup(top.slice(1,13),used).length?cinRow('🔥 Beliebt', dedup(top.slice(1,13),used).map(sCard).join(''),'s-pop'):''}
    ${dedup(fresh,used,12).length?`<div class="collband"><div class="cn">✨ Vorschläge für dich</div></div>${carouselRow(dedup(fresh,used,12).map(sCard).join(''),'s-fresh')}`:''}
    ${tvHighRow}
    ${preisRow}
    ${bingeRow}
    ${procRow}
    ${genreRows}
    <div class="collband"><div class="cn">Alle Serien (${series.length})</div></div>
    <div class="grid">${series.map(sCard).join('')}</div>`;
  b.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>openSeries(+c.dataset.id));
  b.querySelectorAll('[data-hero-play]').forEach(bb=>bb.onclick=()=>openSeries(+bb.dataset.heroPlay));
  b.querySelectorAll('[data-hero-trailer]').forEach(bt=>bt.onclick=()=>{const tr=bt.dataset.tr,tt=bt.dataset.tt;if(tr)trailerOverlay({trailer:tr,title:tt});else{const sid=+bt.dataset.heroTrailer;if(sid)j('/api/series/'+sid).then(d=>{if(d.film&&d.film.trailer&&d.film.trailer!=='none')trailerOverlay({trailer:d.film.trailer,title:tt});else toast('Kein Trailer gefunden')}).catch(()=>{});}});
  bindHeroRotate(b, series, '🔥 Beliebt · Serien');
  initCarousels(b);
};
  $('#sq').oninput=e=>{clearTimeout(window._sd);window._sd=setTimeout(go,250)};
  go();
}

       <button class="btn sec" data-mylist="${f.id}" id="mlbtn" style="margin-top:8px">+ Meine Liste</button>

     <button class="btn sec" style="align-self:flex-start;height:fit-content" onclick="closeModal()">✕</button>
   </div>
   ${(d.streaming&&d.streaming.length)?`<div class="srcs"><h3>Streamen auf</h3><div class="provrow">${d.streaming.map(p=>`<span class="prov" title="${esc(p.name)}">${p.logo?`<img loading="lazy" src="https://image.tmdb.org/t/p/w92${esc(p.logo)}" alt=""><em>${esc(p.name)}</em>`:`<em>${esc(p.name)}</em>`}</span>`).join('')}</div></div>`:''}
   ${d.cast&&d.cast.length?`<div class="srcs"><h3>Besetzung</h3><div class="castrow">${d.cast.map(c=>`
     <div class="cp" data-p="${c.id}">${c.profile_local?`<img src="/posters/${esc(c.profile_local)}" alt="">`:`<div style="width:72px;height:72px;border-radius:50%;background:#1a2133;margin:0 auto"></div>`}

     <div id="epb"></div>
   </div>`;
  function seasonPlaylist(){
    const eps=(seasons||[]).flatMap(ss=>ss.episodes);
    return {mids:eps.map(x=>x.id),

      return `<div class="eprow">${still}<span class="en">E${String(ep).padStart(2,'0')}</span>

            playMedia(+b.dataset.src,null,b.dataset.t);
          });
  };
  if(seasons.length)drawEp(0);

        <div class="s"><span>${f.year||''}</span><span style="color:var(--mut)">${esc((f.genres||'').split(',')[0]||'')}</span></div>
      </div>`)).join(''),'classics')}
    ${r.more?`<button class="btn sec loadmore" id="cmore">Mehr Klassiker laden</button>`:''}</div>`;
    b.querySelectorAll('[data-id]').forEach(c=>c.onclick=()=>openFilm(+c.dataset.id));
    b.querySelectorAll('[data-hero-play]').forEach(b=>b.onclick=()=>openFilm(+b.dataset.heroPlay));
  b.querySelectorAll('[data-hero-trailer]').forEach(bt=>bt.onclick=()=>{const tr=bt.dataset.tr,tt=bt.dataset.tt;if(tr)trailerOverlay({trailer:tr,title:tt});else{const fid=+bt.dataset.heroTrailer;if(!fid)return;j('/api/films/'+fid).then(d=>{if(d.film&&d.film.trailer&&d.film.trailer!=='none')trailerOverlay({trailer:d.film.trailer,title:tt});else toast('Kein Trailer gefunden')}).catch(()=>{});}});
    initCarousels(b);
    const mb=$('#cmore'); if(mb)mb.onclick=()=>{clsPage++;go(false)};
  };
  $('#cq').oninput=()=>{clearTimeout(window._cd);window._cd=setTimeout(()=>go(true),250)};
  go(true);
}

/* Saisonaler App-Hintergrund: Bild aus assets/bg je nach Jahreszeit/Feiertag.
   Sommer hat kein Bild -> dunkel (Standard). Feiertage haben Vorrang vor der
   Jahreszeit (Ostern/Halloween/Weihnachten/Silvester). */
function easterMD(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return mo*100+da;}
function seasonalBg(){
  const d=new Date(),md=(d.getMonth()+1)*100+d.getDate();
  const e=easterMD(d.getFullYear());
  if(md>=1224&&md<=1226)return 'bg/weihnachten001.jpg';      // Weihnachten
  if(md>=1227||md<=101)return 'bg/silvester001.jpg';          // Silvester/Neujahr
  if(md>=1201&&md<=1223)return 'bg/weihnachten002.jpg';       // Advent
  if(md>=e-7&&md<=e+7)return 'bg/ostern.jpg';                 // Ostern
  if(md>=1020&&md<=1031)return 'bg/helloween_herbst001.jpg';  // Halloween
  if(md>=901&&md<=1130)return 'bg/herbst001.jpg';             // Herbst
  if(md>=301&&md<=531)return 'bg/frühjahr001.jpg';            // Frühjahr
  if(md>=102&&md<=228)return 'bg/helloween_winter001.jpg';    // Winter
  return '';                                                  // Sommer: dunkel
}
function applySeasonalBg(){
  const b=seasonalBg(),el=document.getElementById('seabg');
  if(!el)return;
  if(b){el.style.backgroundImage=`url('${b}')`;el.style.opacity='1';}
  else{el.style.backgroundImage='';el.style.opacity='0';}
}
applySeasonalBg();

/* Leerlauf: alle Reiter vorladen, damit Tab-Wechsel sofort ist.
   Laedt die Listen-Endpunkte der anderen Tabs im Hintergrund (requestIdleCallback)
   und fuellt den Client-Cache in j(), damit der naechste render() ohne Netzwerk
   antwortet. Faellt bei jedem Leerlauf ab und wiederholt periodisch. */
const _preloadUrls=['/api/series?q=','/api/hubs','/api/theaters','/api/classics?page=1','/api/people','/api/groups','/api/library','/api/facets','/api/charts?mode=top','/api/birthdays?day=today','/api/downloads'];
let _pi=0,_pl=false;
function preloadAll(){
  if(_pl)return;_pl=true;
  const ric=window.requestIdleCallback||(cb=>setTimeout(cb,600));
  const step=()=>{
    if(_pi>=_preloadUrls.length){_pi=0;_pl=false;return;}
    const u=_preloadUrls[_pi++];
    j(u).catch(()=>{}).then(()=>ric(step));
  };
  ric(step);
}
setInterval(preloadAll,30000);
preloadAll();
loadKids();
// Intro-Video und Ansage starten gemeinsam. Die Ansage entscheidet über den Übergang.
(function(){var el=document.getElementById('appintro');if(!el)return;
 var v=document.getElementById('introVid'),a=document.getElementById('introAudio'),finished=false,started=false;
 function done(){if(finished)return;finished=true;if(a){a.pause();a.currentTime=0;}if(v){v.pause();}el.classList.add('fade');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},800);}
 function start(){if(finished||started||!a||!v)return;started=true;a.currentTime=0;v.currentTime=0;
   // Listener VOR play(): auch wenn Autoplay abgelehnt wird, bleibt das Ende sicher gekoppelt.
   a.addEventListener('ended',done,{once:true});
   var ap=a.play(),vp=v.play();
   if(ap&&ap.catch)ap.catch(function(){
     started=false;
     // Der stumme Film darf weiterlaufen, aber ohne Ansage wird niemals weitergeschaltet.
   });
   if(vp&&vp.catch)vp.catch(function(){ });
 }
 // Abschluss-Listener steht zusätzlich dauerhaft, falls ein Browser das Ereignis sehr früh liefert.
 if(a){a.addEventListener('ended',done);a.addEventListener('canplay',start);}
 if(v){v.addEventListener('canplay',start);}
 // Autoplay versuchen; bei Sperre startet derselbe Ablauf nach der ersten Interaktion erneut.
 start();
 function unlock(){if(!started)start();if(started){document.removeEventListener('pointerdown',unlock);document.removeEventListener('keydown',unlock);}}
 document.addEventListener('pointerdown',unlock);document.addEventListener('keydown',unlock);
})();
// Theater-Vorhang: beim Uebergang (Puffer fertig -> Film sichtbar) oeffnen.
(function(){var cu=document.getElementById('curtain');if(!cu)return;
var was=false;
var mo=new MutationObserver(function(){
  var open=document.body.classList.contains('theater')&&!document.body.classList.contains('intro');
  if(open&&!was){cu.classList.remove('on','part');void cu.offsetWidth;cu.classList.add('on');setTimeout(function(){cu.classList.add('part');},140);setTimeout(function(){cu.classList.remove('on');},2550);}
  was=open;
});
mo.observe(document.body,{attributes:true,attributeFilter:['class']});
})();
</script>

<script>
function shutdownApp() {
    if (!confirm("Möchten Sie die Videothek wirklich beenden?")) return;
    var intro=document.getElementById('appintro');
    var audio=document.getElementById('introAudio');
    if(audio){audio.pause();audio.currentTime=0;}
    if(intro)intro.remove();
    var outro=document.getElementById('appoutro');
    if(outro){outro.classList.add('show');outro.setAttribute('aria-hidden','false');}
    document.body.classList.add('outro-active');
    setTimeout(function(){
        try{
            if(window.pywebview&&window.pywebview.api&&window.pywebview.api.quit){
                window.pywebview.api.quit();
                return;
            }
        }catch(e){}
        fetch('/api/shutdown',{method:'POST',headers:{'Content-Type':'application/json'}})
        .then(function(){window.close();})
        .catch(function(){window.close();});
    },2800);
}
</script>
